[project]
name = "satyapan"
version = "0.1.0"
description = "Payment Verification Desk: transaction-anchored deepfake and fraud verification for Indian SME accounts-payable teams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Team Satyapan (DTU)" }]
# Core = what the API, policy engine and deterministic checkers need. Keep it small.
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "confusable-homoglyphs>=3.3",
]

[project.optional-dependencies]
# Voice detector for uploads (T17). Model files are NOT in the repo (see extension/models/README.md).
# ONNX Runtime stopped shipping Intel-Mac wheels after 1.23: pin there.
audio = [
  "numpy>=1.26",
  "onnxruntime>=1.18; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime>=1.18,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Video deepfake check (docs/VIDEO_DEEPFAKE.md): face landmarks + an ONNX CNN, CPU only.
# Wheels: macOS arm64, Windows x64, Linux x64/arm64 natively; Intel Macs get the last
# mediapipe/onnxruntime releases built for them (Python <= 3.12); Windows on ARM runs x64
# Python (OpenCV, which mediapipe needs, has no win_arm64 wheel). Models: `make video-models`.
video = [
  "numpy>=1.26",
  "pillow>=10",
  "av>=12",
  "onnxruntime>=1.18; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "onnxruntime>=1.18,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "mediapipe>=0.10.21; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
  "mediapipe==0.10.21; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.13'",
]
# Video research (research/video/): training the blend CNN, CV, the benchmark. CPU is enough
# (CPU torch: `uv pip install torch --index-url https://download.pytorch.org/whl/cpu`).
video-research = ["torch>=2.3", "timm>=1.0", "onnx>=1.16", "scikit-learn>=1.4", "pandas>=2.1"]
# Satyapan Seal (docs/SEAL.md): Voice Seal DSP + Intent Seal passkey verification.
seal = ["numpy>=1.26", "scipy>=1.11", "webauthn>=2.2"]
# AWS adapters (T09, T12, T15, T17). The app works without them (local fallbacks).
aws = ["boto3>=1.34"]
# Local speech-to-text for live calls (any OS, CPU). `make asr` installs it and caches the model.
# CTranslate2 has no native Windows-on-ARM wheel: there, run x64 Python (see README, "Laptops").
asr = ["faster-whisper>=1.1; sys_platform != 'win32' or platform_machine != 'ARM64'", "numpy>=1.26"]
# Fastest local Whisper on Apple Silicon (T11, T17). `make asr` adds it on M-series Macs.
asr-mac = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'", "numpy>=1.26"]
# Research scripts that run on a laptop CPU (T18, T19, T21).
research = ["numpy>=1.26", "scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8"]
# Research scripts that need a GPU (Kaggle/Colab only): T19 D3, T20 paraphrasing.
research-gpu = ["transformers>=4.44", "torch>=2.3", "sentence-transformers>=3.0", "datasets>=2.20"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "webauthn>=2.2",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyapan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
filterwarnings = ["ignore:Using `httpx` with"]
markers = [
  "task(id): acceptance test for one task spec in docs/tasks (skipped until the task is implemented)",
  "network: this test is allowed to open network connections (never in unit tests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "research", "scripts"]
extend-exclude = ["console", "extension", "sih"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI uses calls in defaults (Depends, File)

[tool.ruff.lint.isort]
known-first-party = ["satyapan", "research", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/make_demo_data.py" = ["E501"]  # fixture data lines
"scripts/make_pitch_deck.py" = ["E501"]  # deck presentation generator
"src/satyapan/api/routes_dashboard.py" = ["E501"]  # inline dashboard HTML
"src/satyapan/report/pack.py" = ["E501"]  # statutory HTML report templates

[tool.mypy]
python_version = "3.11"
files = [
  "src/satyapan/contracts",
  "src/satyapan/policy",
  "src/satyapan/master",
  "src/satyapan/vault",
  "src/satyapan/voice/rules.py",
  "src/satyapan/video/rules.py",
  "src/satyapan/video/fusion.py",
  "src/satyapan/explain/prompt.py",
  "src/satyapan/seal",
]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scipy.*", "cbor2.*"]
ignore_missing_imports = true
