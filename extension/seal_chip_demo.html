<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Seal chip states (demo)</title>
<link rel="stylesheet" href="sidepanel.css" />
<style>
  /* DEMO PAGE for screenshots: the side-panel seal chip in each state, rendered by the real
     reducer (lib/panel_state.js) and view model (lib/seal_chip.js) from replayed events. */
  html { background: #e5e7eb; }
  body { max-width: none; margin: 0; padding: 0; box-shadow: none; border: 0; background: #e5e7eb; }
  .ribbon { background: #111827; color: #fde68a; font-size: 13px; padding: 6px 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 22px; }
  .panel { background: #f9fafb; border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  .scenario { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin: 0 0 10px; }
  .story { font-size: 12.5px; color: #374151; margin-top: 10px; line-height: 1.45; }
</style>
</head>
<body>
<div class="ribbon">DEMO SCREEN · Satyapan side panel, seal chip states (replayed events, synthetic call)</div>
<div class="grid" id="grid"></div>
<script type="module">
import { applyEvent, initialState } from "./lib/panel_state.js";
import { sealChipView } from "./lib/seal_chip.js";
const R = { employee_id: "emp_rajesh", display_name: "Rajesh Iyer (CFO)" };
const scenarios = [
  ["1 · Real CFO joins", "PASS", [{ state: "acquiring", ...R }],
   "Exec mode started with one Touch ID; first epochs are being checked."],
  ["2 · Real CFO speaking", "PASS", [{ state: "acquiring", ...R }, { state: "sealed", epochs_sealed: 12, epochs_with_speech: 12 }],
   "Seal found in 12 of 12 five-second epochs of this meeting. Information only: it never lowers the band."],
  ["3 · Cloned CFO voice", "HOLD", [{ state: "not_sealed", claimed: true, ...R, epochs_sealed: 0, epochs_with_speech: 4 }],
   "≥ 15 s of speech, no seal → VOICE_UNSEALED_CLAIMED_EXEC (VERIFY). Secrecy + new-account asks take the case to HOLD."],
  ["4 · Spliced audio", "VERIFY", [{ state: "sealed", ...R, epochs_sealed: 6, epochs_with_speech: 6 }, { state: "lost", epochs_sealed: 6, epochs_with_speech: 9 }],
   "Seal present earlier, then 3 epochs of speech without it: the chip says so instead of staying green."],
];
const grid = document.getElementById("grid");
for (const [title, band, events, story] of scenarios) {
  let s = applyEvent(initialState(), { type: "band", band, reason_codes: [] });
  for (const e of events) s = applyEvent(s, { type: "seal", call_id: "call_demo", ...e });
  const v = sealChipView(s.seal);
  const bandCls = { PASS: "band-pass", VERIFY: "band-verify", HOLD: "band-hold" }[s.band];
  grid.insertAdjacentHTML("beforeend", `
    <div class="panel"><p class="scenario">${title}</p>
      <section class="band-banner ${bandCls}"><div class="band-title-row"><span class="band-label-prefix">POLICY BAND</span>
        <span class="band-name">${s.band}</span></div></section>
      <section class="seal-chip ${v.cls}"><span class="seal-icon">${v.icon}</span>
        <div><div class="seal-text">${v.text}</div><div class="seal-sub">${v.sub}</div></div></section>
      <p class="story">${story}</p></div>`);
}
</script>
</body>
</html>
